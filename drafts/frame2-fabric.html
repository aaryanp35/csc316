<!doctype html>
<!-- Draft (not part of the site): storyboard frame 2, "Making the fabric", updated from Sketch 11.
     Horizontal stacked bars, one per fibre: kg CO2e to make 1 kg of knitted T-shirt, split by factory stage.
     Data: public/data/tshirt_stages.csv (Carbonfact). Open with the dev server running: http://localhost:5173/drafts/frame2-fabric.html -->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft: Making the Fabric</title>
  <link rel="stylesheet" href="/src/app.css" />
  <style>
    body { background: var(--bg); padding: 28px; }
    .card { max-width: 1040px; margin: 0 auto; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 28px 32px; }
    .kicker { margin: 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
    h1 { margin: 2px 0 10px; font-size: 1.5rem; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; list-style: none; padding: 0; margin: 4px 0 8px; font-size: 0.85rem; color: var(--muted); }
    .legend li { display: flex; gap: 6px; align-items: center; }
    .legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
    .draft { margin-top: 14px; font-size: 0.75rem; color: var(--faint); }
    svg text { font-family: inherit; }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">Frame 2 · draft</p>
    <h1>Making the fabric, not sewing it, is where the carbon goes</h1>
    <p class="headline" id="headline"></p>
    <p class="sub" id="sub"></p>
    <ul class="legend" id="legend"></ul>
    <svg id="chart" width="976" height="330" role="img"></svg>
    <p class="draft">Draft design for the next milestone. Hover will show each stage's kg CO₂e and water-scarcity score; a toggle will switch the bars to water.
      Source: Carbonfact open LCA database (world averages, factory steps only).</p>
  </div>
  <script type="module">
    import * as d3 from "d3";
    const rows = await d3.csv("/data/tshirt_stages.csv", d3.autoType);
    const facts = await d3.json("/data/facts.json");
    const stages = ["spinning", "knitting", "dyeing", "sewing"];
    const color = { spinning: "var(--series-1)", knitting: "var(--series-3)", dyeing: "var(--series-2)", sewing: "var(--worse)" };
    const materials = ["cotton", "polyester", "wool"];
    const by = d3.rollup(rows, (v) => Object.fromEntries(v.map((d) => [d.stage, d.co2_kg])), (d) => d.material);
    const data = materials.map((m) => ({ material: m, ...by.get(m), total: d3.sum(stages, (s) => by.get(m)[s]) }));

    const fab = Math.round(facts.fabric_making_share_of_factory_co2 * 100);
    d3.select("#headline").html(`<strong>${fab}%</strong> of the factory carbon in a T-shirt is spent making the fabric. Sewing it together is the thin red sliver: about <strong>${Math.round(facts.sewing_share_of_factory_co2 * 100)}%</strong>.`);
    d3.select("#sub").text(`kg CO₂e to make 1 kg of knitted T-shirt, by factory stage. A typical T-shirt weighs ${Math.round(facts.tshirt_weight_kg * 1000)} g, so a cotton one carries about ${facts.tshirt_factory_co2_kg.toFixed(1)} kg CO₂e before anyone wears it.`);
    d3.select("#legend").selectAll("li").data(stages).join("li").html((s) => `<i style="background:${color[s]}"></i>${s}`);

    const svg = d3.select("#chart"), W = 976, H = 330, m = { top: 20, right: 210, bottom: 40, left: 96 };
    const x = d3.scaleLinear().domain([0, d3.max(data, (d) => d.total) * 1.02]).nice().range([m.left, W - m.right]);
    const y = d3.scaleBand().domain(materials).range([m.top, H - m.bottom]).paddingInner(0.38);
    svg.append("g").attr("transform", `translate(0,${H - m.bottom})`).call(d3.axisBottom(x).ticks(6).tickSize(-(H - m.top - m.bottom)))
      .call((g) => g.selectAll(".tick line").attr("stroke", "var(--rule)"));
    svg.append("text").attr("class", "axis-label").attr("x", W - m.right).attr("y", H - 6).attr("text-anchor", "end").text("kg CO₂e per kg of T-shirt");

    const stack = d3.stack().keys(stages)(data);
    svg.append("g").selectAll("g").data(stack).join("g").attr("fill", (s) => color[s.key])
      .selectAll("rect").data((s) => s.map((p) => ({ p, key: s.key }))).join("rect")
      .attr("x", (d) => x(d.p[0]) + 1).attr("width", (d) => Math.max(1.5, x(d.p[1]) - x(d.p[0]) - 2))
      .attr("y", (d) => y(d.p.data.material)).attr("height", y.bandwidth()).attr("rx", 3);
    // stage values inside the wide segments
    svg.append("g").selectAll("text").data(stack.flatMap((s) => s.filter((p) => x(p[1]) - x(p[0]) > 46 && s.key !== "sewing").map((p) => ({ p, key: s.key }))))
      .join("text").attr("x", (d) => (x(d.p[0]) + x(d.p[1])) / 2).attr("y", (d) => y(d.p.data.material) + y.bandwidth() / 2).attr("dy", "0.35em")
      .attr("text-anchor", "middle").style("fill", "#fff").style("font-weight", 600).text((d) => d.p[1] - d.p[0] >= 0 ? (d.p[1] - d.p[0]).toFixed(1) : "");
    svg.append("g").selectAll("text").data(materials).join("text").attr("x", m.left - 12).attr("y", (d) => y(d) + y.bandwidth() / 2)
      .attr("dy", "0.35em").attr("text-anchor", "end").style("font-weight", 700).style("font-size", "14px").text((d) => d[0].toUpperCase() + d.slice(1));
    // total + sewing callout at the end of each bar
    const end = svg.append("g").selectAll("g").data(data).join("g").attr("transform", (d) => `translate(${x(d.total) + 12},${y(d.material) + y.bandwidth() / 2})`);
    end.append("text").attr("dy", "-0.15em").style("font-weight", 700).text((d) => `${d.total.toFixed(1)} kg in total`);
    end.append("text").attr("dy", "1.1em").attr("class", "axis-label").style("fill", "var(--worse)")
      .text((d) => `sewing ${d.sewing.toFixed(2)} kg (${(d.sewing / d.total * 100).toFixed(1)}%)`);
  </script>
</body>
</html>
